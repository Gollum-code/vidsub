<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vidsub</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">vidsub</div>
      <div class="topbar-right">
        <span id="deps-state" class="chip muted">检测中...</span>
      </div>
    </header>

    <main>
      <section class="card" id="input-card">
        <div id="drop-zone" class="drop-zone">
          <input id="file-input" type="file" hidden
            accept="video/*,audio/*,.mp4,.mkv,.mov,.avi,.webm,.ts,.m4a,.mp3,.wav,.flac,.aac" />
          <p class="drop-title">把视频/音频拖到这里，或点击选择文件</p>
          <button id="pick-btn" type="button" class="btn">选择文件</button>
        </div>

        <div id="file-row" class="file-row hidden">
          <span class="muted" id="file-name"></span>
          <button id="change-file" type="button" class="btn small">更换</button>
        </div>

        <div class="form-grid">
          <label>
            <span>whisper 可执行文件（whisper-cli）</span>
            <input id="whisper-path" type="text" placeholder="例如 D:\whisper\win\whisper-cli.exe" />
          </label>
          <label>
            <span>模型文件路径（*.bin）</span>
            <input id="model-path" type="text" placeholder="例如 D:\whisper\models\ggml-small.bin" />
          </label>
          <label>
            <span>语言</span>
            <select id="language">
              <option value="auto" selected>自动检测</option>
              <option value="zh">中文</option>
              <option value="en">英语</option>
              <option value="ja">日语</option>
              <option value="ko">韩语</option>
            </select>
          </label>
        </div>

        <div class="actions">
          <button id="start-btn" class="btn primary" disabled>开始识别</button>
          <select id="model-size" class="mini hidden">
            <option value="small">small 465MB（最准）</option>
            <option value="base">base 142MB（均衡）</option>
            <option value="tiny">tiny 75MB（最快）</option>
          </select>
          <button id="download-model-btn" class="btn hidden">下载模型</button>
          <span id="queue-hint" class="muted small"></span>
          <span id="limit-hint" class="muted small"></span>
        </div>

        <div id="progress-wrap" class="hidden">
          <div class="progress-track"><div id="progress-bar" class="progress-fill"></div></div>
          <div id="progress-message" class="muted small"></div>
        </div>
      </section>

      <section id="result-card" class="card hidden">
        <div class="result-head">
          <h2>字幕结果</h2>
          <div class="result-actions">
            <button id="burn-btn" class="btn" disabled>烧录字幕</button>
            <select id="export-format" class="mini">
              <option value="srt" selected>SRT</option>
              <option value="vtt">VTT</option>
              <option value="ass">ASS</option>
            </select>
            <select id="export-style" class="mini hidden"></select>
            <button id="export-btn" class="btn" disabled>导出</button>
          </div>
        </div>
        <div class="translate-bar">
          <select id="api-provider" class="mini">
            <option value="deepseek" selected>DeepSeek</option>
            <option value="openai">OpenAI</option>
          </select>
          <input id="api-key" type="password" placeholder="API Key（BYOK）" autocomplete="off" />
          <select id="target-lang" class="mini">
            <option value="zh">→ 中文</option>
            <option value="en">→ 英语</option>
            <option value="ja">→ 日语</option>
            <option value="ko">→ 韩语</option>
          </select>
          <button id="translate-btn" class="btn">翻译</button>
          <button id="restore-btn" class="btn small hidden">还原原文</button>
        </div>
        <video id="preview" class="preview hidden" controls preload="metadata"></video>
        <canvas id="waveform" class="waveform hidden" height="120"></canvas>
        <div id="segment-list" class="segment-list"></div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
